{% load static %}<!doctype html>
<html lang="ru">
<head>

    <title>{% block title %}Магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <a class="logo" href="{% url 'cart_list' %}">🛒 Магазин</a>

</html>
